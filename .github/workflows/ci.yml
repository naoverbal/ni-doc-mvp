name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  ci:
    name: Lint, Build e Testes
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nidoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências (raiz)
        run: npm install
        working-directory: ./backend

      - name: Instalar dependências (frontend)
        run: npm install
        working-directory: ./frontend

      - name: Lint (backend)
        run: npm run lint
        working-directory: ./backend

      - name: Lint (frontend)
        run: npm run lint
        working-directory: ./frontend

      - name: Build (backend)
        run: npm run build
        working-directory: ./backend

      - name: Build (frontend)
        run: npm run build
        working-directory: ./frontend

      - name: Testes (backend)
        run: npm test
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nidoc_test
          CRYPTO_KEY: dGVzdGtleXRlc3RrZXl0ZXN0a2V5dGVzdGtleXQ=
          SESSION_SECRET: test-session-secret-for-ci-only
          NODE_ENV: test
          PORT: 3001
