# =============================================================================
# ni-doc — configuração do Nginx (reverse proxy + TLS + estáticos)
# =============================================================================
#
# Alvo: VPS de produção (Hostinger). Este arquivo é instalado como um "site" do
# Nginx, por exemplo em /etc/nginx/sites-available/ni-doc.conf e habilitado com
# um symlink em /etc/nginx/sites-enabled/ (ou colocado diretamente em
# /etc/nginx/conf.d/ni-doc.conf, conforme a distro).
#
# Responsabilidades:
#   - Redirecionar HTTP (80) para HTTPS (443), expondo o desafio ACME para a
#     renovação automática de certificados Let's Encrypt (certbot).
#   - Encerrar TLS 1.3 (com fallback 1.2), com ciphers modernos e OCSP stapling.
#   - Fazer proxy reverso de /api/ para o backend Express (porta 3000).
#   - Servir a SPA (build do Vite) como arquivos estáticos, com fallback de SPA
#     para /index.html (rotas client-side como /publico/orcamento/:token).
#   - Aplicar headers de segurança (HSTS, CSP, etc.), coerentes com o helmet do
#     backend (ver design.md §13.3).
#
# -----------------------------------------------------------------------------
# AJUSTE PELO OPERADOR antes de aplicar:
#   1. server_name  -> troque ni-doc.example.com pelo domínio real.
#   2. ssl_certificate / ssl_certificate_key -> caminhos emitidos pelo certbot
#      em /etc/letsencrypt/live/<DOMÍNIO>/ (fullchain.pem e privkey.pem).
#   3. root -> diretório do build da SPA (ver docker-compose.prod.yml / deploy).
#   4. upstream ni_doc_backend -> host:porta do backend. Em Docker Compose, o
#      host é o nome do serviço ("backend"); fora do Compose, use 127.0.0.1.
#
# EMISSÃO INICIAL DO CERTIFICADO (one-time, antes do primeiro reload com TLS):
#   Como os blocos 443 referenciam certificados que ainda não existem, emita-os
#   primeiro no modo webroot (o location ACME abaixo já serve o desafio):
#     certbot certonly --webroot -w /var/www/certbot \
#       -d ni-doc.example.com
#   Depois valide e recarregue: `nginx -t && systemctl reload nginx`.
#   A renovação é automática via `certbot renew` (cron/systemd timer).
# =============================================================================

# Upstream do backend Express. Em Docker Compose, "backend" resolve pelo DNS da
# rede; fora do Compose, troque por 127.0.0.1:3000.
upstream ni_doc_backend {
    server backend:3000;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# HTTP (porta 80): só serve o desafio ACME e redireciona todo o resto p/ HTTPS.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ni-doc.example.com;

    # Desafio ACME do Let's Encrypt (certbot --webroot). Mantemos este location
    # em HTTP porque a validação ocorre antes de existir certificado válido.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Qualquer outra rota é promovida a HTTPS (301 permanente).
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS (porta 443): TLS, estáticos da SPA e proxy reverso para a API.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ni-doc.example.com;

    # --- TLS (Let's Encrypt) --------------------------------------------------
    # Troque <DOMÍNIO> pelo valor de server_name acima.
    ssl_certificate     /etc/letsencrypt/live/ni-doc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ni-doc.example.com/privkey.pem;

    # TLS 1.3 preferencial, com 1.2 como fallback (RNF-002). TLS < 1.2 desabilitado.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # Ciphers modernos para o fallback TLS 1.2 (as suites do 1.3 são fixas).
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_timeout 1d;
    ssl_session_cache shared:ni_doc_ssl:10m;
    ssl_session_tickets off;

    # OCSP stapling (reduz latência de validação do certificado).
    ssl_stapling on;
    ssl_stapling_verify on;
    # chain.pem emitido pelo certbot junto do certificado.
    ssl_trusted_certificate /etc/letsencrypt/live/ni-doc.example.com/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Headers de segurança -------------------------------------------------
    # HSTS: 1 ano, inclui subdomínios e preload (coerente com design.md §13.3).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # CSP espelhando o helmet do backend (design.md §13.3). 'unsafe-inline' em
    # style-src é necessário para estilos inline da SPA; data:/blob: em img e
    # data: em font cobrem QR Code, imagens embutidas e fontes base64 do PDF/UI.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Esconde a versão do Nginx nas respostas e páginas de erro.
    server_tokens off;

    # --- Limites e compressão -------------------------------------------------
    # Uploads de template (PDF de fundo), imagens e fontes customizadas. 25 MB
    # cobre esses casos com folga; ajuste se os templates forem maiores.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # --- Proxy reverso da API -------------------------------------------------
    # Tudo sob /api/ vai para o backend Express. O prefixo é preservado (o
    # Express registra as rotas como /api/...), então NÃO reescrevemos o path.
    location /api/ {
        proxy_pass http://ni_doc_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Mantém a conexão viva com o upstream (keepalive do bloco upstream).
        proxy_set_header Connection "";

        # Geração de PDF pode levar alguns segundos (Puppeteer); folga nos timeouts.
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Não deixa o Nginx bufferizar respostas grandes (ex.: PDF em download).
        proxy_buffering off;
    }

    # --- Health check do backend (opcional, útil para o deploy) ---------------
    location = /health {
        proxy_pass http://ni_doc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- SPA (build estático do Vite) -----------------------------------------
    # root aponta para o diretório do build da SPA copiado no deploy. Ajuste
    # conforme o docker-compose.prod.yml (ex.: volume servido pelo Nginx).
    root /var/www/ni-doc/frontend;
    index index.html;

    # Assets com hash no nome (Vite) podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA: rotas client-side (ex.: /publico/orcamento/:token,
    # /login, /orcamentos) devem servir index.html, deixando o React Router
    # resolver a rota. O index.html em si não é cacheado.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
